<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" fill="none">
  <defs>
    <!-- High-end Indigo to Cyan Tech Gradient -->
    <linearGradient id="logo-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
  </defs>
  
  <!-- Sleek Minimalist Monogram (P + A) -->
  <g stroke="url(#logo-grad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- P Stem and Loop -->
    <path d="M 7, 18 V 6 H 11.5 C 13.8 6, 13.8 11.5, 11.5 11.5 H 7" />
    <!-- A Frame -->
    <path d="M 11, 11.5 L 14.5, 6 L 18, 18" />
    <!-- A Crossbar -->
    <path d="M 9.5, 14 H 15.5" />
  </g>
</svg>