<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48">
  <defs>
    <!-- Gradient for the logo lines -->
    <linearGradient id="logo-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded tile -->
  <rect width="22" height="22" x="1" y="1" rx="6" fill="#030014" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1" />
  
  <!-- Styled Monogram (P + A) -->
  <g stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <!-- P Stem & Loop -->
    <path d="M 7.5, 16.5 V 7.5 H 12 A 2.25, 2.25 0 0 1 12, 12 H 7.5" />
    <!-- A Frame -->
    <path d="M 11.5, 12 L 14.5, 7.5 L 17.5, 16.5" />
    <!-- A Crossbar -->
    <path d="M 10, 14.2 H 15.5" />
  </g>
</svg>