<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      font-size: 50px;
      font-weight: 800;
      letter-spacing: -3px;
    }
    .p {
      fill: #00f0ff;
      filter: drop-shadow(0px 0px 3px #00f0ff) drop-shadow(0px 0px 6px rgba(0, 240, 255, 0.5));
    }
    .a {
      fill: #f8f9fa;
      filter: drop-shadow(0px 0px 3px #ffffff) drop-shadow(0px 0px 6px rgba(255, 255, 255, 0.5));
    }
  </style>
  <rect width="100" height="100" fill="#0f1115" rx="24" ry="24" />
  <text x="50" y="70" text-anchor="middle">
    <tspan class="p">P</tspan><tspan class="a">A</tspan>
  </text>
</svg>